<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Otobüs Tarifesi</title>
    <style>
      :root {
        color-scheme: light;
        --color-bg: #F7F8FC;
        --color-surface: #FFFFFF;
        --color-surface-secondary: #F0F1F7;
        --color-surface-hover: #E9EAF3;
        --color-border: #DFE2EC;
        --color-border-strong: #C8CBD7;
        --color-text-primary: #25283A;
        --color-text-secondary: #4F5366;
        --color-text-muted: #75798C;
        --color-text-disabled: #A3A6B3;
        --color-text-on-primary: #FFFFFF;
        --color-primary: #8E8AC7;
        --color-primary-light: #E6E4F5;
        --color-primary-hover: #7D78B7;
        --color-primary-dark: #6F6AAA;
        --color-secondary: #76A9D1;
        --color-secondary-light: #E1EFF8;
        --color-secondary-dark: #5689B2;
        --color-success: #4C9B76;
        --color-success-light: #E2F3E9;
        --color-error: #C75C68;
        --color-error-light: #F9E3E6;
        --color-warning: #C5943F;
        --color-warning-light: #FFF2D9;
        --color-info: #528FC4;
        --color-info-light: #E2F0FA;
      }

      .theme-purple {
        --color-primary: #8E8AC7;
        --color-primary-light: #E6E4F5;
        --color-primary-hover: #7D78B7;
        --color-primary-dark: #6F6AAA;
      }

      .theme-blue {
        --color-primary: #76A9D1;
        --color-primary-light: #E1EFF8;
        --color-primary-hover: #6699C2;
        --color-primary-dark: #5689B2;
      }

      .theme-mint {
        --color-primary: #72B99A;
        --color-primary-light: #DFF3EA;
        --color-primary-hover: #62A98A;
        --color-primary-dark: #52977A;
      }

      .theme-pink {
        --color-primary: #D28FAF;
        --color-primary-light: #F6E1EB;
        --color-primary-hover: #C27E9F;
        --color-primary-dark: #B56E90;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 8px 6px 20px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--color-text-primary);
        background: var(--color-bg);
      }

      main { width: min(100%, 920px); margin: 0 auto; }

      .clock {
        padding: 8px 10px;
        text-align: center;
        color: var(--color-text-on-primary);
        background: var(--color-primary);
        border-radius: 8px;
      }

      #date { font-size: clamp(.82rem, 3.5vw, 1.1rem); font-weight: 650; }
      #time { margin-top: 1px; font-size: clamp(1.65rem, 8vw, 2.5rem); font-weight: 700; letter-spacing: 1px; }
      #day-type { margin-top: 1px; font-size: .72rem; opacity: .85; }

      #status:empty { display: none; }
      #status.error {
        margin: 16px 4px 0;
        text-align: center;
        color: var(--color-error);
        font-size: .9rem;
      }

      .routes {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        margin-top: 7px;
      }

      .route-card:last-child:nth-child(odd) { grid-column: 1 / -1; }

      .route-card {
        overflow: hidden;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 6px;
      }

      .route-title {
        margin: 0;
        padding: 5px 8px;
        color: var(--color-text-on-primary);
        background: var(--color-primary);
        font-size: .9rem;
        text-align: center;
      }

      .directions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        justify-content: space-evenly;
      }

      .directions.single {
        display: block;
      }

      .directions.single .direction {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 7px 8px;
      }

      .directions.single .direction h3 {
        margin: 0;
      }
      .direction { padding: 6px 2px 7px; min-width: 0; }
      .direction + .direction { border-left: 1px solid var(--color-border); }

      .direction h3 {
        min-height: 26px;
        margin: 0 0 4px;
        display: grid;
        place-items: center;
        font-size: clamp(.58rem, 2.7vw, .82rem);
        text-align: center;
        line-height: 1.2;
      }

      .trip-list {
        display: grid;
        grid-template-columns: 1fr;
        gap: 4px;
        width: min(100%, 60px);
        margin: 0 auto;
      }

      .directions.single .trip-list {
        grid-template-columns: none;
        grid-auto-flow: column;
        grid-auto-columns: 60px;
        width: max-content;
        margin: 0;
      }

      .trip {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        aspect-ratio: 1;
        min-width: 0;
        padding: 3px;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 4px;
      }

      .trip-time {
        font-size: clamp(.76rem, 3.4vw, 1rem);
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .trip-diff {
        font-size: clamp(.66rem, 3vw, .82rem);
        font-weight: 750;
        line-height: 1;
      }

      .trip.past .trip-diff { color: var(--color-error); }
      .trip.next .trip-diff { color: var(--color-success); }
      .empty { padding: 24px 8px; color: var(--color-text-muted); text-align: center; }
      @media (min-width: 720px) {
        body { padding-top: 20px; }
        .routes { gap: 10px; }
        .trip-list { width: min(100%, 72px); }
        .directions.single .trip-list { width: max-content; }
      }
    </style>
  </head>
  <body class="theme-blue">
    <main>
      <section class="clock" aria-label="Tarih ve saat">
        <div id="date"></div>
        <div id="time"></div>
        <div id="day-type"></div>
      </section>

      <div id="status"></div>
      <section id="routes" class="routes" aria-live="polite"></section>
    </main>

    <script>
      const DATA_FILE = "otobussaat.txt";
      const ROUTES = [
        { number: "61", directions: ["ARDIÇLI TOKİ", "JAPON PARKI"] },
        { number: "51", directions: ["ARDIÇLI TOKİ", "JAPON PARKI"] },
        { number: "49", directions: ["ARDIÇLI TOKİ"] }
      ];

      let schedules = {};
      let loadError = "";

      function repairTurkish(text) {
        const replacements = {
          "Ä°": "İ", "Ä±": "ı", "ÄŸ": "ğ", "Äž": "Ğ", "ÅŸ": "ş", "Å": "Ş",
          "Ã‡": "Ç", "Ã§": "ç", "Ã–": "Ö", "Ã¶": "ö", "Ãœ": "Ü", "Ã¼": "ü"
        };
        return text.replace(/Ä°|Ä±|ÄŸ|Äž|ÅŸ|Å|Ã‡|Ã§|Ã–|Ã¶|Ãœ|Ã¼/g, value => replacements[value]);
      }

      function key(value) {
        return repairTurkish(value).trim().replace(/\s+/g, " ").toLocaleUpperCase("tr-TR");
      }

      function parseSchedule(text) {
        const result = {};
        let route = "";
        let day = "";
        let direction = "";

        for (const rawLine of text.split(/\r?\n/)) {
          const line = repairTurkish(rawLine).trim();
          if (!line) continue;

          if (/^\d+$/.test(line)) {
            route = line;
            day = "";
            direction = "";
            result[route] ||= {};
            continue;
          }

          const lineKey = key(line);
          if (["HAFTA İÇİ", "CUMARTESİ", "PAZAR"].includes(lineKey)) {
            day = lineKey;
            direction = "";
            if (route) result[route][day] ||= {};
            continue;
          }

          const timeMatch = line.match(/^(\d{1,2}):(\d{2})$/);
          if (timeMatch && route && day && direction) {
            const hour = Number(timeMatch[1]);
            const minute = Number(timeMatch[2]);
            if (hour < 24 && minute < 60) {
              let total = hour * 60 + minute;
              if (hour < 4) total += 1440;
              result[route][day][direction].push(total);
            }
            continue;
          }

          if (route && day) {
            direction = lineKey;
            result[route][day][direction] ||= [];
          }
        }

        for (const routeData of Object.values(result)) {
          for (const dayData of Object.values(routeData)) {
            for (const times of Object.values(dayData)) times.sort((a, b) => a - b);
          }
        }
        return result;
      }

      function getServiceContext(now) {
        const rawMinutes = now.getHours() * 60 + now.getMinutes();
        const serviceDate = new Date(now);
        let currentMinutes = rawMinutes;
        if (rawMinutes < 240) {
          serviceDate.setDate(serviceDate.getDate() - 1);
          currentMinutes += 1440;
        }

        const weekDay = serviceDate.getDay();
        const dayType = weekDay === 0 ? "PAZAR" : weekDay === 6 ? "CUMARTESİ" : "HAFTA İÇİ";
        return { currentMinutes, dayType };
      }

      function formatTime(totalMinutes) {
        const minutes = totalMinutes % 1440;
        return `${String(Math.floor(minutes / 60)).padStart(2, "0")}:${String(minutes % 60).padStart(2, "0")}`;
      }

      function formatDifference(minutes) {
        return minutes === 0 ? "0" : String(minutes);
      }

      function selectedTrips(times, currentMinutes) {
        if (!times?.length) return [];
        let previousIndex = -1;
        for (let index = 0; index < times.length; index++) {
          if (times[index] <= currentMinutes) previousIndex = index;
        }

        const trips = [];
        if (previousIndex >= 0) trips.push({ time: times[previousIndex], past: true });
        for (let index = previousIndex + 1; index < times.length && trips.filter(t => !t.past).length < 3; index++) {
          trips.push({ time: times[index], past: false });
        }
        return trips;
      }

      function renderDirection(name, times, currentMinutes) {
        const trips = selectedTrips(times, currentMinutes);
        const directionLabel = name === "JAPON PARKI"
          ? "<span>Japon</span><span>Parkı</span>"
          : "<span>Ardıçlı</span><span>Toki</span>";
        return `
          <div class="direction">
            <h3>${directionLabel}</h3>
            ${trips.length ? `<div class="trip-list">${trips.map(trip => {
              const difference = Math.abs(trip.time - currentMinutes);
              return `<div class="trip ${trip.past ? "past" : "next"}">
                <span class="trip-time">${formatTime(trip.time)}</span>
                <span class="trip-diff">${formatDifference(difference)}</span>
              </div>`;
            }).join("")}</div>` : '<div class="empty">Sefer bilgisi yok</div>'}
          </div>`;
      }

      function renderSchedule() {
        const now = new Date();
        const { currentMinutes, dayType } = getServiceContext(now);
        document.getElementById("day-type").textContent = dayType === "HAFTA İÇİ" ? "Hafta içi tarifesi" : `${dayType[0]}${dayType.slice(1).toLocaleLowerCase("tr-TR")} tarifesi`;

        if (loadError) return;
        document.getElementById("routes").innerHTML = ROUTES.map(({ number: route, directions }) => {
          const daySchedule = schedules[route]?.[dayType] || {};
          return `<article class="route-card">
            <h2 class="route-title">Hat ${route}</h2>
            <div class="directions ${directions.length === 1 ? "single" : ""}">
              ${directions.map(direction => renderDirection(direction, daySchedule[direction], currentMinutes)).join("")}
            </div>
          </article>`;
        }).join("");
      }

      function updateClock() {
        const now = new Date();
        document.getElementById("date").textContent = new Intl.DateTimeFormat("tr-TR", {
          weekday: "long", day: "numeric", month: "long", year: "numeric"
        }).format(now);
        document.getElementById("time").textContent = new Intl.DateTimeFormat("tr-TR", {
          hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
        }).format(now);
      }

      async function loadSchedule() {
        try {
          const response = await fetch(`${DATA_FILE}?v=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          schedules = parseSchedule(await response.text());
          renderSchedule();
        } catch (error) {
          loadError = error.message;
          const status = document.getElementById("status");
          status.className = "error";
          status.textContent = "Tarife dosyası yüklenemedi. Siteyi bir web sunucusu veya GitHub Pages üzerinden açın.";
        }
      }

      updateClock();
      setInterval(updateClock, 1000);
      setInterval(renderSchedule, 30000);
      loadSchedule();
    </script>
  </body>
</html>
