<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Otobüs Tarifesi</title>
    <style>
      :root {
        color-scheme: light;
        --primary: #0f766e;
        --primary-dark: #115e59;
        --surface: #ffffff;
        --background: #f0fdfa;
        --text: #16302d;
        --muted: #64748b;
        --border: #d7e5e3;
        --past: #dc2626;
        --next: #15803d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 18px 12px 30px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: linear-gradient(160deg, #ccfbf1 0, var(--background) 35%, #f8fafc 100%);
      }

      main { width: min(100%, 920px); margin: 0 auto; }

      .clock {
        padding: 18px;
        text-align: center;
        color: white;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(15, 118, 110, .22);
      }

      #date { font-size: clamp(1rem, 4vw, 1.25rem); font-weight: 650; }
      #time { margin-top: 3px; font-size: clamp(2rem, 10vw, 3.25rem); font-weight: 800; letter-spacing: 1px; }
      #day-type { margin-top: 3px; font-size: .84rem; opacity: .85; }

      #status {
        margin: 18px 4px 8px;
        text-align: center;
        color: var(--muted);
        font-size: .92rem;
      }

      .routes { display: grid; gap: 14px; margin-top: 14px; }

      .route-card {
        overflow: hidden;
        background: var(--surface);
        border: 1px solid rgba(15, 118, 110, .13);
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, .07);
      }

      .route-title {
        margin: 0;
        padding: 11px 14px;
        color: white;
        background: var(--primary);
        font-size: 1.3rem;
        text-align: center;
      }

      .directions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .directions.single { grid-template-columns: 1fr; }
      .direction { padding: 13px 10px 15px; min-width: 0; }
      .direction + .direction { border-left: 1px solid var(--border); }

      .direction h3 {
        min-height: 40px;
        margin: 0 0 9px;
        display: grid;
        place-items: center;
        font-size: clamp(.82rem, 3.7vw, 1rem);
        text-align: center;
        line-height: 1.2;
      }

      .trip-list { display: grid; gap: 7px; }
      .trip {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        min-height: 43px;
        padding: 8px 10px;
        background: #f8fafc;
        border: 1px solid #edf2f7;
        border-radius: 10px;
      }

      .trip-time { font-size: clamp(1rem, 5vw, 1.25rem); font-weight: 800; font-variant-numeric: tabular-nums; }
      .trip-diff { font-size: clamp(.72rem, 3.3vw, .86rem); font-weight: 750; white-space: nowrap; }
      .trip.past .trip-diff { color: var(--past); }
      .trip.next { background: #f0fdf4; border-color: #bbf7d0; }
      .trip.next .trip-diff { color: var(--next); }
      .empty { padding: 24px 8px; color: var(--muted); text-align: center; }
      .error { color: #b91c1c !important; }

      @media (min-width: 720px) {
        body { padding-top: 28px; }
        .routes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .route-card:last-child:nth-child(odd) { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="clock" aria-label="Tarih ve saat">
        <div id="date"></div>
        <div id="time"></div>
        <div id="day-type"></div>
      </section>

      <div id="status">Tarife yükleniyor…</div>
      <section id="routes" class="routes" aria-live="polite"></section>
    </main>

    <script>
      const DATA_FILE = "otobussaat.txt";
      const ROUTES = {
        "61": ["ARDIÇLI TOKİ", "JAPON PARKI"],
        "51": ["ARDIÇLI TOKİ", "JAPON PARKI"],
        "49": ["ARDIÇLI TOKİ"]
      };

      let schedules = {};
      let loadError = "";

      function repairTurkish(text) {
        const replacements = {
          "Ä°": "İ", "Ä±": "ı", "ÄŸ": "ğ", "Äž": "Ğ", "ÅŸ": "ş", "Å": "Ş",
          "Ã‡": "Ç", "Ã§": "ç", "Ã–": "Ö", "Ã¶": "ö", "Ãœ": "Ü", "Ã¼": "ü"
        };
        return text.replace(/Ä°|Ä±|ÄŸ|Äž|ÅŸ|Å|Ã‡|Ã§|Ã–|Ã¶|Ãœ|Ã¼/g, value => replacements[value]);
      }

      function key(value) {
        return repairTurkish(value).trim().replace(/\s+/g, " ").toLocaleUpperCase("tr-TR");
      }

      function parseSchedule(text) {
        const result = {};
        let route = "";
        let day = "";
        let direction = "";

        for (const rawLine of text.split(/\r?\n/)) {
          const line = repairTurkish(rawLine).trim();
          if (!line) continue;

          if (/^\d+$/.test(line)) {
            route = line;
            day = "";
            direction = "";
            result[route] ||= {};
            continue;
          }

          const lineKey = key(line);
          if (["HAFTA İÇİ", "CUMARTESİ", "PAZAR"].includes(lineKey)) {
            day = lineKey;
            direction = "";
            if (route) result[route][day] ||= {};
            continue;
          }

          const timeMatch = line.match(/^(\d{1,2}):(\d{2})$/);
          if (timeMatch && route && day && direction) {
            const hour = Number(timeMatch[1]);
            const minute = Number(timeMatch[2]);
            if (hour < 24 && minute < 60) {
              let total = hour * 60 + minute;
              if (hour < 4) total += 1440;
              result[route][day][direction].push(total);
            }
            continue;
          }

          if (route && day) {
            direction = lineKey;
            result[route][day][direction] ||= [];
          }
        }

        for (const routeData of Object.values(result)) {
          for (const dayData of Object.values(routeData)) {
            for (const times of Object.values(dayData)) times.sort((a, b) => a - b);
          }
        }
        return result;
      }

      function getServiceContext(now) {
        const rawMinutes = now.getHours() * 60 + now.getMinutes();
        const serviceDate = new Date(now);
        let currentMinutes = rawMinutes;
        if (rawMinutes < 240) {
          serviceDate.setDate(serviceDate.getDate() - 1);
          currentMinutes += 1440;
        }

        const weekDay = serviceDate.getDay();
        const dayType = weekDay === 0 ? "PAZAR" : weekDay === 6 ? "CUMARTESİ" : "HAFTA İÇİ";
        return { currentMinutes, dayType };
      }

      function formatTime(totalMinutes) {
        const minutes = totalMinutes % 1440;
        return `${String(Math.floor(minutes / 60)).padStart(2, "0")}:${String(minutes % 60).padStart(2, "0")}`;
      }

      function formatDifference(minutes, isPast) {
        if (minutes === 0) return "şimdi";
        return isPast ? `${minutes} dk önce` : `${minutes} dk sonra`;
      }

      function selectedTrips(times, currentMinutes) {
        if (!times?.length) return [];
        let previousIndex = -1;
        for (let index = 0; index < times.length; index++) {
          if (times[index] <= currentMinutes) previousIndex = index;
        }

        const trips = [];
        if (previousIndex >= 0) trips.push({ time: times[previousIndex], past: true });
        for (let index = previousIndex + 1; index < times.length && trips.filter(t => !t.past).length < 3; index++) {
          trips.push({ time: times[index], past: false });
        }
        return trips;
      }

      function renderDirection(name, times, currentMinutes) {
        const trips = selectedTrips(times, currentMinutes);
        return `
          <div class="direction">
            <h3>${name === "JAPON PARKI" ? "Japon Parkı" : "Ardıçlı TOKİ"}</h3>
            ${trips.length ? `<div class="trip-list">${trips.map(trip => {
              const difference = Math.abs(trip.time - currentMinutes);
              return `<div class="trip ${trip.past ? "past" : "next"}">
                <span class="trip-time">${formatTime(trip.time)}</span>
                <span class="trip-diff">${formatDifference(difference, trip.past)}</span>
              </div>`;
            }).join("")}</div>` : '<div class="empty">Sefer bilgisi yok</div>'}
          </div>`;
      }

      function renderSchedule() {
        const now = new Date();
        const { currentMinutes, dayType } = getServiceContext(now);
        document.getElementById("day-type").textContent = dayType === "HAFTA İÇİ" ? "Hafta içi tarifesi" : `${dayType[0]}${dayType.slice(1).toLocaleLowerCase("tr-TR")} tarifesi`;

        if (loadError) return;
        document.getElementById("routes").innerHTML = Object.entries(ROUTES).map(([route, directions]) => {
          const daySchedule = schedules[route]?.[dayType] || {};
          return `<article class="route-card">
            <h2 class="route-title">${route} Numaralı Hat</h2>
            <div class="directions ${directions.length === 1 ? "single" : ""}">
              ${directions.map(direction => renderDirection(direction, daySchedule[direction], currentMinutes)).join("")}
            </div>
          </article>`;
        }).join("");
      }

      function updateClock() {
        const now = new Date();
        document.getElementById("date").textContent = new Intl.DateTimeFormat("tr-TR", {
          weekday: "long", day: "numeric", month: "long", year: "numeric"
        }).format(now);
        document.getElementById("time").textContent = new Intl.DateTimeFormat("tr-TR", {
          hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
        }).format(now);
      }

      async function loadSchedule() {
        try {
          const response = await fetch(`${DATA_FILE}?v=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          schedules = parseSchedule(await response.text());
          document.getElementById("status").textContent = "Tarife otobussaat.txt dosyasından güncel olarak yüklendi.";
          renderSchedule();
        } catch (error) {
          loadError = error.message;
          const status = document.getElementById("status");
          status.className = "error";
          status.textContent = "Tarife dosyası yüklenemedi. Siteyi bir web sunucusu veya GitHub Pages üzerinden açın.";
        }
      }

      updateClock();
      setInterval(updateClock, 1000);
      setInterval(renderSchedule, 30000);
      loadSchedule();
    </script>
  </body>
</html>
